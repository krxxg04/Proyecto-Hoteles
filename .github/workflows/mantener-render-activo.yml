name: Mantener Render activo

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - name: Consultar salud del backend
        run: npm run mantener-render-activo
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
