services:
  - name: hotel-demo-backend
    type: web
    runtime: node
    rootDir: Backend
    buildCommand: npm install && npm run build
    preDeployCommand: npm run migrar:nube
    startCommand: npm run start
    healthCheckPath: /api/salud
    initialDeployHook: npm run demo:init
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEMO_HOSTAL_NOMBRE
        value: Hostal Demo
      - key: DEMO_HOSTAL_SLUG
        value: demo
      - key: DEMO_HOSTAL_CIUDAD
        value: Lima
      - key: DEMO_ADMIN_DNI
        sync: false
      - key: DEMO_ADMIN_NOMBRE
        value: Admin Demo
      - key: DEMO_ADMIN_PIN
        sync: false
      - key: DEMO_RESEED
        value: "0"
