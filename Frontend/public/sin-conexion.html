<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Hostal Inteligente</title>
    <style>
      :root {
        color-scheme: dark light;
        --canvas: #1e1e1e;
        --raised: #2c2c2c;
        --line: #444;
        --tx: #f1f3f4;
        --tx-sec: #b4b7ba;
        --tx-muted: #8a8f94;
        --brand: #7c4dff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --canvas: #f5f5f5;
          --raised: #fff;
          --line: #e4e4e4;
          --tx: #1a1d1f;
          --tx-sec: #45494e;
          --tx-muted: #727880;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--tx);
        font: 400 14px/21px Inter, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .caja {
        max-width: 380px;
        width: 100%;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
      }
      .icono {
        width: 44px;
        height: 44px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: rgba(124, 77, 255, 0.14);
        font-size: 22px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--tx-sec);
        font-size: 13.5px;
      }
      ul {
        margin: 14px 0 0;
        padding: 0;
        list-style: none;
        text-align: left;
        color: var(--tx-muted);
        font-size: 12.5px;
      }
      li {
        padding: 3px 0 3px 14px;
        position: relative;
      }
      li::before {
        content: '·';
        position: absolute;
        left: 4px;
      }
      button {
        margin-top: 18px;
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        font: 600 13px/1 Inter, system-ui, sans-serif;
        cursor: pointer;
      }
      button:hover {
        background: #6d3ef2;
      }
      button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="caja">
      <div class="icono" aria-hidden="true">📶</div>
      <h1>Sin conexión</h1>
      <p>
        No se pudo llegar al servidor, así que no se muestra nada: unos datos viejos serían peores
        que ninguno.
      </p>
      <ul>
        <li>Revisa el wifi del hostal.</li>
        <li>Si acabas de hacer un cobro, vuelve a comprobarlo cuando haya señal.</li>
      </ul>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
